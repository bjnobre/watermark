<svg xmlns="http://www.w3.org/2000/svg"
     width="460" height="86" viewBox="0 0 460 86">
  <text x="0" y="31" fill="#ffffff"
        font-family="Noto Sans, DejaVu Sans, sans-serif"
        font-size="26" font-weight="400"
        text-rendering="geometricPrecision">Activate Linux</text>
  <text x="0" y="61" fill="#ffffff"
        font-family="Noto Sans, DejaVu Sans, sans-serif"
        font-size="14" font-weight="400"
        text-rendering="geometricPrecision">Go to Settings to activate Linux.</text>
</svg>
